<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="balanced laptop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18221b"/><stop offset="1" stop-color="#0a120c"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f3a2a"/><stop offset=".55" stop-color="#07231a"/><stop offset="1" stop-color="#0a120c"/></linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3730"/><stop offset="1" stop-color="#18221b"/></linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b4a3f"/><stop offset="1" stop-color="#232c25"/></linearGradient>
    <radialGradient id="under" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#56ffa8" stop-opacity="0.4"/><stop offset="1" stop-color="#56ffa8" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- lid -->
  <rect x="195" y="103" width="410" height="246" rx="10" fill="url(#lid)"/>
  <rect x="204" y="112" width="392" height="224" rx="5" fill="url(#screen)"/>
  <circle cx="400" cy="342" r="2.4" fill="#56ffa8" opacity=".5"/>

  <!-- base, splayed toward the viewer -->
  <path d="M179 349 L621 349 L657 371 L143 371 Z" fill="url(#deck)"/>
  <path d="M205 353.8 L595 353.8 L625 368.8 L175 368.8 Z" fill="#0f1a13" opacity=".55"/>
  <rect x="358" y="364.4" width="84" height="5.0" rx="2" fill="#2d3730" opacity=".8"/>
  <rect x="272.8" y="361.8" width="18" height="5.7" rx="2" fill="#0a120c" opacity=".85"/>
  <rect x="509.2" y="361.8" width="18" height="5.7" rx="2" fill="#0a120c" opacity=".85"/>
  <rect x="173" y="371" width="34" height="7" rx="3" fill="#0a120c"/>
  <rect x="593" y="371" width="34" height="7" rx="3" fill="#0a120c"/>

  <!-- underglow -->
  <ellipse cx="400" cy="383" rx="297" ry="34" fill="url(#under)"/>
  <rect x="151" y="373" width="498" height="2.5" rx="1.2" fill="#56ffa8" opacity="0.4"/>
</svg>
