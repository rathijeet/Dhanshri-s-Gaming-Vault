<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="thin laptop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18221b"/><stop offset="1" stop-color="#0a120c"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f3a2a"/><stop offset=".55" stop-color="#07231a"/><stop offset="1" stop-color="#0a120c"/></linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3730"/><stop offset="1" stop-color="#18221b"/></linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b4a3f"/><stop offset="1" stop-color="#232c25"/></linearGradient>
    <radialGradient id="under" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#56ffa8" stop-opacity="0.3"/><stop offset="1" stop-color="#56ffa8" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- lid -->
  <rect x="215" y="114" width="370" height="231" rx="10" fill="url(#lid)"/>
  <rect x="224" y="123" width="352" height="209" rx="5" fill="url(#screen)"/>
  <circle cx="400" cy="338" r="2.4" fill="#56ffa8" opacity=".5"/>

  <!-- base, splayed toward the viewer -->
  <path d="M199 345 L601 345 L637 359 L163 359 Z" fill="url(#deck)"/>
  <path d="M225 348.1 L575 348.1 L605 357.6 L195 357.6 Z" fill="#0f1a13" opacity=".55"/>
  <rect x="358" y="354.8" width="84" height="5.0" rx="2" fill="#2d3730" opacity=".8"/>



  <!-- underglow -->
  <ellipse cx="400" cy="371" rx="277" ry="34" fill="url(#under)"/>
  <rect x="171" y="361" width="458" height="2.5" rx="1.2" fill="#56ffa8" opacity="0.3"/>
</svg>
