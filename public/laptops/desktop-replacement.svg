<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="desktop replacement laptop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18221b"/><stop offset="1" stop-color="#0a120c"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f3a2a"/><stop offset=".55" stop-color="#07231a"/><stop offset="1" stop-color="#0a120c"/></linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3730"/><stop offset="1" stop-color="#18221b"/></linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b4a3f"/><stop offset="1" stop-color="#232c25"/></linearGradient>
    <radialGradient id="under" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#56ffa8" stop-opacity="0.7"/><stop offset="1" stop-color="#56ffa8" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- lid -->
  <rect x="152" y="73" width="496" height="290" rx="10" fill="url(#lid)"/>
  <rect x="161" y="82" width="478" height="268" rx="5" fill="url(#screen)"/>
  <circle cx="400" cy="356" r="2.4" fill="#56ffa8" opacity=".5"/>

  <!-- base, splayed toward the viewer -->
  <path d="M136 363 L664 363 L700 401 L100 401 Z" fill="url(#deck)"/>
  <path d="M162 371.4 L638 371.4 L668 397.2 L132 397.2 Z" fill="#0f1a13" opacity=".55"/>
  <rect x="358" y="389.6" width="84" height="6.8" rx="2" fill="#2d3730" opacity=".8"/>
  <rect x="253.0" y="385.0" width="18" height="9.9" rx="2" fill="#0a120c" opacity=".85"/>
  <rect x="308.2" y="385.0" width="18" height="9.9" rx="2" fill="#0a120c" opacity=".85"/>
  <rect x="363.4" y="385.0" width="18" height="9.9" rx="2" fill="#0a120c" opacity=".85"/>
  <rect x="418.6" y="385.0" width="18" height="9.9" rx="2" fill="#0a120c" opacity=".85"/>
  <rect x="473.8" y="385.0" width="18" height="9.9" rx="2" fill="#0a120c" opacity=".85"/>
  <rect x="529.0" y="385.0" width="18" height="9.9" rx="2" fill="#0a120c" opacity=".85"/>
  <rect x="130" y="401" width="34" height="7" rx="3" fill="#0a120c"/>
  <rect x="636" y="401" width="34" height="7" rx="3" fill="#0a120c"/>

  <!-- underglow -->
  <ellipse cx="400" cy="413" rx="340" ry="34" fill="url(#under)"/>
  <rect x="108" y="403" width="584" height="2.5" rx="1.2" fill="#56ffa8" opacity="0.7"/>
</svg>
