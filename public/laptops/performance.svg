<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="performance laptop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#18221b"/><stop offset="1" stop-color="#0a120c"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f3a2a"/><stop offset=".55" stop-color="#07231a"/><stop offset="1" stop-color="#0a120c"/></linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d3730"/><stop offset="1" stop-color="#18221b"/></linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b4a3f"/><stop offset="1" stop-color="#232c25"/></linearGradient>
    <radialGradient id="under" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#56ffa8" stop-opacity="0.55"/><stop offset="1" stop-color="#56ffa8" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- lid -->
  <rect x="175" y="87" width="450" height="270" rx="10" fill="url(#lid)"/>
  <rect x="184" y="96" width="432" height="248" rx="5" fill="url(#screen)"/>
  <circle cx="400" cy="350" r="2.4" fill="#56ffa8" opacity=".5"/>

  <!-- base, splayed toward the viewer -->
  <path d="M159 357 L641 357 L677 387 L123 387 Z" fill="url(#deck)"/>
  <path d="M185 363.6 L615 363.6 L645 384.0 L155 384.0 Z" fill="#0f1a13" opacity=".55"/>
  <rect x="358" y="378.0" width="84" height="5.4" rx="2" fill="#2d3730" opacity=".8"/>
  <rect x="263.6" y="374.4" width="18" height="7.8" rx="2" fill="#0a120c" opacity=".85"/>
  <rect x="348.5" y="374.4" width="18" height="7.8" rx="2" fill="#0a120c" opacity=".85"/>
  <rect x="433.5" y="374.4" width="18" height="7.8" rx="2" fill="#0a120c" opacity=".85"/>
  <rect x="518.4" y="374.4" width="18" height="7.8" rx="2" fill="#0a120c" opacity=".85"/>
  <rect x="153" y="387" width="34" height="7" rx="3" fill="#0a120c"/>
  <rect x="613" y="387" width="34" height="7" rx="3" fill="#0a120c"/>

  <!-- underglow -->
  <ellipse cx="400" cy="399" rx="317" ry="34" fill="url(#under)"/>
  <rect x="131" y="389" width="538" height="2.5" rx="1.2" fill="#56ffa8" opacity="0.55"/>
</svg>
